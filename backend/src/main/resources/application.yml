spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rnd_sample
    username: rnd_sample
    password: rnd_sample
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

rnd:
  feishu:
    mode: ${FEISHU_MODE:MOCK}
    base-url: ${FEISHU_BASE_URL:https://open.feishu.cn}
    app-url: ${FEISHU_APP_URL:http://127.0.0.1:4174/}
    card-action-secret: ${FEISHU_CARD_ACTION_SECRET:}
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
