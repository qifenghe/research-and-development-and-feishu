name: longhui-rnd
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    image: ${POSTGRES_IMAGE:-m.daocloud.io/docker.io/library/postgres:16-alpine}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: rnd_sample
      POSTGRES_USER: rnd_sample
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run prepare-config.py first}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rnd_sample -d rnd_sample"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
  backend:
    image: longhui/backend:20261019
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rnd_sample
      SPRING_DATASOURCE_USERNAME: rnd_sample
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_AUTH_REQUIRED: "true"
      RND_AUTH_BOOTSTRAP_USERS: "false"
      RND_FEEDBACK_BOOTSTRAP_DEMO: "false"
      RND_FEISHU_BOOTSTRAP_USERS: "false"
      RND_SESSION_TEST_BUSINESS_API_AUTHENTICATION_BYPASS: "false"
      FEISHU_ENABLED: "false"
      ARCHIVE_STORAGE: local
      ARCHIVE_LOCAL_ROOT: /data/archive
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${BACKEND_CHECK_PORT:-18080}:8080"
    volumes:
      - archive_data:/data/archive
    logging: *logging
  web:
    image: m.daocloud.io/docker.io/library/nginx:stable-alpine
    platform: linux/amd64
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    logging: *logging

volumes:
  postgres_data:
  archive_data:
